# Set memory settings for the Gradle daemon
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Android specific settings
android.useAndroidX=true
android.enableJetifier=true

# Kotlin & KSP stabilization
kotlin.daemon.jvmargs=-Xmx2g
kotlin.compiler.execution.strategy=in-process

# Fix for "jlink executable does not exist"
# Prevents Gradle from picking up the incomplete JRE from VS Code extensions
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true

# Workaround for AAPT2 link timeouts/crashes in some environments
# android.aapt2.parallelResourceProcessing=false
