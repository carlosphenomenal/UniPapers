services:
  db:
    image: postgres:17-alpine
    container_name: unipapers-db
    environment:
      POSTGRES_DB: unipapers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unipapers"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - unipapers

  app:
    build: .
    container_name: unipapers-app

    depends_on:
      db:
        condition: service_healthy

    environment:
      - DB_URL=jdbc:postgresql://db:5432/unipapers
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres

    expose:
      - "8080"

    networks:
      - unipapers

  nginx:
    image: nginx:alpine
    container_name: unipapers-nginx

    depends_on:
      - app

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "80:80"

    networks:
      - unipapers

volumes:
  postgres_data:

networks:
  unipapers:
    name: unipapers