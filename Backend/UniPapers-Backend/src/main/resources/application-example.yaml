# ------------------------------------------------
# Copy this file to the same directory as: application.yaml
# Fill in your real secrets/credentials in application.yaml only.
# Do NOT commit your application.properties. It is already ignored by .gitignore.
# Path: src/main/resources/application.properties

server:
  port: 8080
  servlet:
    context-path: /api
  address: 0.0.0.0

spring:
  application:
    name: UniPapers-Backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unipapers}
    username: ${DB_USERNAME:your_username}
    password: ${DB_PASSWORD:your_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

cloudflare:
  r2:
    account-id: your-account-id          # From Cloudflare dashboard
    access-key: your-r2-access-key-id
    secret-key: your-r2-secret-access-key
    bucket-name: your-bucket-name
    public-url: https://pub-xxxx.r2.dev     # Public bucket URL for serving files

sendgrid:
  api-key: ${SENDGRID_API_KEY:your_api_key_here}
  from-email: ${SENDGRID_FROM_EMAIL:your_verified_sender_email_here}

auth:
  verification-code:
    expiry-minutes: 15

security:
  jwt:
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
